<fieldset class="vehicle-type">
  <legend class="visually-hidden">Vehicle Type</legend>
  <div class="segments">
    @for (option of options; track option.value) {
      <label class="segment" [class.on]="option.value === value()">
        <input
          type="radio"
          name="vehicle-type"
          [value]="option.value"
          [checked]="option.value === value()"
          (change)="valueChange.emit(option.value)"
        />
        {{ option.label }}
      </label>
    }
  </div>
</fieldset>
