<ol class="version-list">
  @for (version of versions(); track version.id) {
    <li>
      <a class="uploaded-at" [routerLink]="['/admin/fare-matrices', version.id]">
        Uploaded {{ version.uploadedAt | date: 'medium' }}
      </a>
      @if (version.isActive) {
        <strong class="active-badge">Active</strong>
      }
      <span class="details">
        {{ version.rowCount }} rows · {{ version.note ?? 'No note' }}
      </span>
    </li>
  }
</ol>
