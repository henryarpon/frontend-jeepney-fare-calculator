<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Jeepney Fare Calculator</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preload" href="fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Set the theme before the first paint so the page never flashes the wrong one.
    // Same rules and storage key as ThemeService (src/app/core/theme/theme.service.ts).
    try {
      var theme = localStorage.getItem('jfc-theme');
      if (theme !== 'light' && theme !== 'dark') {
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
